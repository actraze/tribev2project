<body class="bg-[#050505] text-on-background min-h-screen flex flex-col font-body-md overflow-hidden relative">
<!-- Background Terminal Effect (Scanning Lines) -->
<div class="absolute inset-0 pointer-events-none opacity-20 z-0">
<div class="w-full h-full" style="background-image: repeating-linear-gradient(transparent, transparent 2px, rgba(0, 242, 255, 0.05) 3px, rgba(0, 242, 255, 0.05) 4px);"></div>
</div>
<!-- Luminous Accent Top -->
<div class="absolute top-0 left-0 right-0 h-[1px] bg-gradient-to-r from-transparent via-primary-container to-transparent opacity-50 z-10"></div>
<!-- TopAppBar -->
<header class="bg-zinc-950/70 backdrop-blur-xl border-b border-white/10 flex justify-between items-center px-8 h-16 w-full docked full-width top-0 z-50 relative">
<div class="flex items-center">
<span class="text-2xl font-black text-cyan-400 tracking-tighter drop-shadow-[0_0_10px_rgba(0,242,255,0.5)]">TRIBE v2</span>
</div>
<!-- Navigation Links Hidden for Transactional Page, but keeping structure as per instruction for generic TopAppBar -->
<nav class="hidden md:flex gap-8 items-center font-['Space_Grotesk'] tracking-tight text-sm uppercase">
<!-- Suppressing nav items for upload intent -->
</nav>
<button class="bg-primary-container text-on-primary font-label-sm text-label-sm px-4 py-2 rounded uppercase tracking-wider hover:drop-shadow-[0_0_10px_rgba(0,242,255,0.6)] transition-all">
            Launch App
        </button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center p-margin relative z-10">
<!-- Upload Container -->
<div class="w-full max-w-2xl bg-[#121212] border border-white/5 rounded-xl backdrop-blur-xl bg-opacity-70 flex flex-col items-center justify-center p-xl relative overflow-hidden shadow-[0_4px_40px_rgba(0,0,0,0.8)] before:absolute before:inset-0 before:bg-gradient-to-b before:from-primary-container/5 before:to-transparent before:pointer-events-none before:h-[2px]">
<!-- Terminal Header -->
<div class="w-full flex justify-between items-center mb-8 border-b border-white/10 pb-4">
<div class="flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-primary-container drop-shadow-[0_0_5px_rgba(0,242,255,0.8)]"></span>
<span class="font-data-mono text-data-mono text-on-surface-variant uppercase tracking-widest">System Input / Scan</span>
</div>
<span class="font-data-mono text-data-mono text-zinc-500">Node: 0x8F2A</span>
</div>
<!-- Drag & Drop Zone -->
<div class="w-full border-2 border-dashed border-primary-container/40 rounded-lg p-xl flex flex-col items-center justify-center bg-black/40 pulse-border hover:border-primary-container hover:bg-primary-container/5 transition-all duration-300 cursor-pointer group relative">
<!-- Scanning Line Effect on Hover -->
<div class="absolute left-0 right-0 h-[2px] bg-primary-container/50 drop-shadow-[0_0_8px_rgba(0,242,255,0.8)] top-0 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
<!-- Icon Stack -->
<div class="relative mb-6">
<span class="material-symbols-outlined text-6xl text-outline-variant group-hover:text-primary-container transition-colors" style="font-variation-settings: 'FILL' 0;">movie</span>
<span class="material-symbols-outlined text-4xl text-primary-container absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 drop-shadow-[0_0_12px_rgba(0,242,255,0.9)] opacity-80" style="font-variation-settings: 'FILL' 1;">psychology</span>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface mb-2 text-center">Drop your video to begin neural encoding</h2>
<p class="font-data-mono text-data-mono text-outline mb-8 text-center bg-[#0A0A0A] px-4 py-1 rounded border border-white/5 inline-block">
                    Supports .mp4, .mov up to 100MB
                </p>
<!-- Actions -->
<button class="bg-[#1A1A1A] text-on-surface border border-white/10 font-label-sm text-label-sm uppercase tracking-wider px-6 py-3 rounded hover:bg-white/5 hover:border-white/20 transition-all focus:outline-none focus:border-primary-container focus:drop-shadow-[0_0_8px_rgba(0,242,255,0.4)]">
                    Browse Files
                </button>
</div>
<!-- Technical readouts / decorative -->
<div class="w-full mt-6 flex justify-between text-[10px] font-data-mono text-zinc-600 uppercase tracking-widest">
<span>Encryption: AES-256 Active</span>
<span>Uplink: Standby</span>
</div>
